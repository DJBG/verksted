<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verkstednotater</title>
<script>try{const t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: raskt verktøy for en mekaniker, rolig og ryddig
   IDEA: arbeidsseddelen på benken: delekatalog til venstre, notatlappen til høyre
   PICTURE: selve notatet slik det ser ut i Intern info
   COLOUR and TYPE: hvit / nesten svart, verkstedsrød aksent; DM Sans + DM Mono som resten av verksted
   LAYOUT: kategorier | fraser i grupper (Foran / Bak / Begge) | notat; stablet på mobil */
:root{color-scheme:light dark;--bg:light-dark(#f6f6f8,#0f0f12);--card:light-dark(#ffffff,#18181c);--ink:light-dark(#16161a,#ececef);--mute:light-dark(#686872,#9a9aa4);--line:light-dark(#e3e3e8,#2a2a31);--chip:light-dark(#f3f3f6,#212127);--acc:#c8102e;--ok:light-dark(#0f7a3e,#4cc283);--okbg:light-dark(#eaf7ef,#13261b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(20px,3vw,36px) max(4vw,16px) 110px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
h1{font-size:clamp(30px,4vw,42px);line-height:1.05;margin:0 0 6px;font-weight:700}
.sub{color:var(--mute);margin:0;max-width:60ch}
.theme{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:500}
.theme svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:190px minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tabs{display:flex;flex-direction:column;gap:2px;padding:8px;position:sticky;top:16px}
.tab{border:0;background:none;padding:10px 12px;min-height:44px;border-radius:9px;cursor:pointer;color:var(--mute);font-weight:500;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tab:hover{background:var(--chip);color:var(--ink)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tab i{font-style:normal;font-size:12px;background:var(--acc);color:#fff;border-radius:999px;padding:1px 7px}
.phr{padding:18px 20px 22px}
.phr h2{font-size:22px;margin:0 0 4px;line-height:1.2}
.group{margin-top:18px}
.group h3{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);padding:9px 13px;min-height:44px;border-radius:10px;cursor:pointer;text-align:left;line-height:1.3;font-size:15px}
.chip:hover{border-color:var(--mute)}
.chip.used{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.chip.mine{border-style:dashed}
.note{position:sticky;top:16px;overflow:hidden}
.note header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.note header span{font-weight:600}.note header b{font-size:13px;color:var(--mute);font-weight:500}
.pre{font:14px/1.7 'DM Mono',ui-monospace,monospace;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:120px;background:var(--bg);margin:12px;border-radius:10px}
.dim{color:var(--mute)}
.sec{padding:4px 16px 12px}
.sec h3{font-size:13px;font-weight:600;color:var(--mute);margin:8px 0 6px}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:2px}
.row input{flex:1;font:14px 'DM Mono',ui-monospace,monospace;border:1px solid transparent;background:none;padding:8px;border-radius:8px;min-height:40px}
.row input:hover,.row input:focus{border-color:var(--line);background:var(--bg)}
.ic{border:0;background:none;width:34px;height:40px;border-radius:8px;cursor:pointer;color:var(--mute);font-size:16px;flex:none}
.ic:hover{background:var(--chip);color:var(--ink)}
.ic.on{color:var(--acc)}
.empty{color:var(--mute);font-size:14px;margin:4px 0}
.free{display:flex;gap:8px}
.mlabel{font-size:14px;margin:0 0 6px}.kjrow{margin-bottom:8px}.kjrow .chip{min-height:40px;padding:7px 12px;font:14px 'DM Mono',ui-monospace,monospace}.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meas{margin-bottom:8px;align-items:center}.unit{color:var(--mute);font-size:14px;width:22px}
.free input{flex:1;font-size:16px;padding:9px 12px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.why .chip{font-size:14px;min-height:40px;padding:7px 11px}
.btn{border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600;background:var(--chip);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.acts label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-right:auto;min-height:44px;cursor:pointer}
.acts input{width:18px;height:18px;accent-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:12px;align-items:center;z-index:9}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.bar{display:none}
@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,400px)}.tabs{grid-column:1/-1;flex-direction:row;overflow-x:auto;position:static}.tab{flex:none}}
@media(max-width:800px){.grid{grid-template-columns:minmax(0,1fr)}.note{position:static}.theme span{display:none}
 .bar{display:flex;position:fixed;left:0;right:0;bottom:0;gap:10px;align-items:center;padding:12px max(4vw,16px);background:var(--card);border-top:1px solid var(--line);z-index:5}
 .bar span{margin-right:auto;color:var(--mute);font-size:14px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Verkstednotater</h1>
      <p class="sub">Velg kategori, trykk på det du har gjort, og kopier notatet inn under Intern info.</p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Bytt mellom lys og mørk modus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path id="ticon" d=""/></svg><span id="tlabel">Mørk</span>
    </button>
  </div>
  <div class="grid">
    <nav class="panel tabs" id="tabs" role="tablist" aria-label="Kategorier"></nav>
    <section class="panel phr" aria-live="polite"><h2 id="ctitle"></h2><div id="groups"></div></section>
    <aside class="panel note" aria-label="Notat">
      <header><span>Intern info</span><b id="count">0 linjer</b></header>
      <div class="pre" id="pre"></div>
      <div class="sec"><h3>Rediger linjer</h3><ul class="rows" id="rows"></ul></div>
      <div class="sec"><h3>Målinger</h3>
        <p class="mlabel">Kjedestrekk (Unior)</p>
        <div class="chips kjrow" id="kjVals"></div>
        <div class="chips kjrow" id="kjMods"></div>
        <form class="free meas" id="kmForm"><input id="km" inputmode="numeric" placeholder="Km-stand (elsykkel)" aria-label="Km-stand"><span class="unit">km</span><button class="btn" type="submit">Legg til</button></form>
      </div>
      <div class="sec"><h3>Egen tekst</h3>
        <form class="free" id="freeForm"><input id="free" placeholder="Skriv og trykk Enter" autocomplete="off" aria-label="Egen tekst"><button class="btn" type="submit">Legg til</button></form>
      </div>
      <div class="sec why"><h3>Årsak på siste linje</h3><div class="chips" id="why"></div></div>
      <div class="acts">
        <label><input type="checkbox" id="sep" checked> Skillelinje</label>
        <button class="btn" id="clear" type="button">Tøm</button>
        <button class="btn pri" id="copy" type="button">Kopier</button>
      </div>
    </aside>
  </div>
</div>
<div class="bar"><span id="count2">0 linjer</span><button class="btn pri" id="copy2" type="button">Kopier notat</button></div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button" hidden>Angre</button></div>
<script>
{
const CATS={
 'Service':{'Generelt':['Enkel service.','Full service.','Førstegangsservice.','Generell sjekk – alt ok.','Vasket og smurt sykkelen.','Strammet alle bolter til riktig moment.','Prøvekjørt – alt fungerer som det skal.']},
 'Bremser':{
  'Foran':['Nye bremseklosser foran.','Luftet bremsen foran.','Justert bremsen foran.','Byttet bremseslange foran.','Byttet kaliper foran med slange.','Rettet bremseskiven foran.','Byttet bremseskive foran.'],
  'Bak':['Nye bremseklosser bak.','Luftet bremsen bak.','Justert bremsen bak.','Byttet bremseslange bak.','Byttet kaliper bak med slange.','Rettet bremseskiven bak.','Byttet bremseskive bak.'],
  'Foran og bak':['Nye bremseklosser foran og bak.','Luftet bremsene foran og bak.','Justert bremsene foran og bak.','Byttet bremseskiver foran og bak.']},
 'Drivverk':{
  'Komplett':['Byttet hele drivverket (kjede, kassett, krankhjul og trinsehjul).','Rengjort hele drivverket.'],
  'Kjede og kassett':['Byttet kjede.','Byttet kassett.','Byttet kjede og kassett.','Renset og smurt drivverket.'],
  'Gir':['Justert girene.','Byttet bakgir.','Byttet girwire og strømpe.','Rettet girhengeren.','Byttet girhenger.','Byttet trinsehjul.'],
  'Krank':['Byttet krankdrev.','Byttet kjedekasse.']},
 'Hjul og dekk':{
  'Foran':['Byttet slange foran.','Byttet dekk foran.','Rettet forhjulet.','Strammet eiker foran.'],
  'Bak':['Byttet slange bak.','Byttet dekk bak.','Rettet bakhjulet.','Strammet eiker bak.'],
  'Foran og bak':['Skiftet til vinterdekk.','Skiftet til sommerdekk.','Byttet slanger foran og bak.','Pumpet dekkene til riktig trykk.']},
 'Lager':{
  'Kranklager':['Byttet kranklager.','Justert kranklageret.'],
  'Styrelager':['Justert styrelageret.','Byttet styrelager.'],
  'Hjullager':['Justert navlageret foran.','Justert navlageret bak.','Byttet hjullager.']},
 'Demper':{
  'Gaffel':['Service på gaffelen (nedre del).','Justert lufttrykk i gaffelen.'],
  'Bakdemper':['Service på bakdemperen (luftkammer).','Justert lufttrykk i bakdemperen.'],
  'Generelt':['Rengjort og smurt støvtetningene.','Justert sag etter førerens vekt.']},
 'Elsykkel':{
  'Programvare':['Systemet er oppdatert.','Lest av feilkoder – ingen feil.'],
  'Batteri':['Kontrollert batteri og lader.','Batteriet var i dvale – vekket og ladet.'],
  'Sensorer og ledninger':['Byttet hastighetssensor.','Kontrollert kontakter og ledninger.']},
 'Krank og pedal':{'Pedaler':['Byttet pedaler.','Smurt pedalgjengene.'],'Krank':['Strammet krankarmene.']},
 'Styre og sete':{'Styre':['Byttet håndtak.','Byttet styretape.','Strammet stem.'],'Sete':['Setepinnen er justert (setet var løst).','Byttet sete.','Smurt setepinnen.']},
 'Annet':{'Tilbehør':['Montert skjermer.','Montert bagasjebrett.','Montert ringeklokke.','Montert støtte.','Byttet lys.'],'Diverse':['Skrue til støtte ble byttet (Loctite).']}
};
const WHY=['fordi det gamle var slitt.','fordi det gamle var skadet.','fordi den var korrodert.','etter kundens ønske.','– anbefales byttet ved neste service.'];
const SEP='-------------------------';
const SUN='M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z';
const MOON='M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z';
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lines=store.get('vn-lines',[]),mine=store.get('vn-mine',[]),cat=store.get('vn-cat','Service'),useSep=store.get('vn-sep',true),undoState=null,tt;
const tabNames=()=>mine.length?[...Object.keys(CATS),'Mine fraser']:Object.keys(CATS);
if(!tabNames().includes(cat))cat='Service';
const save=()=>{store.set('vn-lines',lines);store.set('vn-mine',mine);store.set('vn-cat',cat);store.set('vn-sep',useSep)};
const text=()=>lines.length?(useSep?SEP+'\n':'')+'Verkstednotater\n'+lines.map(l=>'- '+l).join('\n'):'';
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function toast(msg,undo){$('tmsg').textContent=msg;$('undo').hidden=!undo;$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('on'),undo?5000:1800)}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintTheme(){const d=isDark();$('ticon').setAttribute('d',d?SUN:MOON);$('tlabel').textContent=d?'Lys':'Mørk'}
$('theme').onclick=()=>{const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}paintTheme()};
const groupsOf=c=>c==='Mine fraser'?{'Lagret av deg':mine}:CATS[c];
const usedIn=c=>Object.values(groupsOf(c)).flat().filter(p=>lines.includes(p)).length;
function renderTabs(){const t=$('tabs');t.innerHTML='';for(const name of tabNames()){const b=el('button','tab');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',name===cat);b.appendChild(el('span','',name));const n=usedIn(name);if(n)b.appendChild(el('i','',n));b.onclick=()=>{cat=name;save();renderTabs();renderGroups()};t.appendChild(b)}}
function renderGroups(){$('ctitle').textContent=cat;const g=$('groups');g.innerHTML='';for(const [name,list] of Object.entries(groupsOf(cat))){const box=el('div','group');box.appendChild(el('h3','',name));const c=el('div','chips');for(const p of list){const b=el('button','chip'+(lines.includes(p)?' used':'')+(cat==='Mine fraser'?' mine':''),p);b.type='button';b.setAttribute('aria-pressed',lines.includes(p));b.onclick=()=>add(p);c.appendChild(b)}box.appendChild(c);g.appendChild(box)}}
function renderWhy(){const c=$('why');for(const w of WHY){const b=el('button','chip',w);b.type='button';b.onclick=()=>{if(!lines.length)return toast('Legg til en linje først');const i=lines.length-1;lines[i]=lines[i].replace(/\.$/,'')+' '+w;save();render()};c.appendChild(b)}}
function renderPre(){const pre=$('pre');pre.textContent='';if(!lines.length){pre.appendChild(el('span','dim','Notatet vises her.'));return}if(useSep)pre.appendChild(el('span','dim',SEP+'\n'));pre.appendChild(document.createTextNode('Verkstednotater\n'+lines.map(l=>'- '+l).join('\n')))}
function renderRows(){const ul=$('rows');ul.innerHTML='';if(!lines.length){ul.appendChild(el('li','empty','Ingen linjer ennå.'));}
 lines.forEach((l,i)=>{const li=el('li','row');const inp=el('input');inp.value=l;inp.setAttribute('aria-label','Linje '+(i+1));inp.oninput=()=>{lines[i]=inp.value;save();renderPre()};inp.onchange=()=>{renderTabs();renderGroups()};
  const mk=(sym,label,fn,on)=>{const b=el('button','ic'+(on?' on':''),sym);b.type='button';b.title=label;b.setAttribute('aria-label',label);b.onclick=fn;return b};
  li.append(inp,
   mk('↑','Flytt opp',()=>{if(i>0){[lines[i-1],lines[i]]=[lines[i],lines[i-1]];save();render()}}),
   mk(mine.includes(l)?'★':'☆','Lagre i Mine fraser',()=>{const v=lines[i].trim();if(!v)return;if(mine.includes(v)){mine=mine.filter(m=>m!==v);toast('Fjernet fra Mine fraser')}else{mine.push(v);toast('Lagret i Mine fraser')}if(!tabNames().includes(cat))cat='Service';save();render()},mine.includes(l)),
   mk('×','Slett linje',()=>{undoState=[...lines];lines.splice(i,1);save();render();toast('Linje slettet',true)}));
  ul.appendChild(li)});
 const n=lines.length+(lines.length===1?' linje':' linjer');$('count').textContent=n;$('count2').textContent=n}
function render(){renderPre();renderRows();renderTabs();renderGroups();if(window.kjSync)kjSync()}
function add(p){if(lines.includes(p)){undoState=[...lines];lines=lines.filter(l=>l!==p);toast('Fjernet',true)}else lines.push(p);save();render()}
async function copy(){if(!lines.length)return toast('Ingenting å kopiere ennå');try{await navigator.clipboard.writeText(text());toast('Kopiert – lim inn under Intern info')}catch(e){const r=document.createRange();r.selectNodeContents($('pre'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Merket – trykk Ctrl+C')}}
$('freeForm').addEventListener('submit',e=>{e.preventDefault();let v=$('free').value.trim();if(!v)return;if(!/[.!?)]$/.test(v))v+='.';v=v[0].toUpperCase()+v.slice(1);lines.push(v);$('free').value='';save();render()});
function setMeasure(prefix,line){const i=lines.findIndex(l=>l.startsWith(prefix));if(i>=0)lines[i]=line;else lines.push(line);save();render()}
const KJ=['0,25','0,50','0,75','0,80','0,90','1,0'];let kj={v:null,plus:0,over:false};
function kjLine(){return 'Kjedestrekk: '+(kj.over?'Over ':'')+kj.v+'+'.repeat(kj.plus)+' Unior.'}
function renderKj(){const a=$('kjVals');a.innerHTML='';for(const v of KJ){const b=el('button','chip'+(kj.v===v?' sel':''),v);b.type='button';b.setAttribute('aria-pressed',kj.v===v);b.onclick=()=>{kj.v=kj.v===v?null:v;applyKj()};a.appendChild(b)}
 const m=$('kjMods');m.innerHTML='';['','+','++','+++'].forEach((p,i)=>{const b=el('button','chip'+(kj.plus===i?' sel':''),p||'Ingen +');b.type='button';b.setAttribute('aria-pressed',kj.plus===i);b.onclick=()=>{kj.plus=i;applyKj()};m.appendChild(b)});
 const o=el('button','chip'+(kj.over?' sel':''),'Over');o.type='button';o.setAttribute('aria-pressed',kj.over);o.onclick=()=>{kj.over=!kj.over;applyKj()};m.appendChild(o)}
function applyKj(){if(kj.v)setMeasure('Kjedestrekk:',kjLine());else{const i=lines.findIndex(l=>l.startsWith('Kjedestrekk:'));if(i>=0){lines.splice(i,1);save();render()}}renderKj()}
{const ex=lines.find(l=>l.startsWith('Kjedestrekk:'));if(ex){const mm=ex.match(/^Kjedestrekk: (Over )?([\d,]+)(\+*) Unior\.$/);if(mm&&KJ.includes(mm[2]))kj={v:mm[2],plus:mm[3].length,over:!!mm[1]}}}
window.kjSync=()=>{if(kj.v&&!lines.some(l=>l.startsWith('Kjedestrekk:'))){kj={v:null,plus:0,over:false};renderKj()}};
renderKj();
$('kmForm').addEventListener('submit',e=>{e.preventDefault();const v=$('km').value.replace(/\s/g,'');if(!/^\d+$/.test(v))return toast('Skriv bare tallet, f.eks. 1250');setMeasure('Km-stand:','Km-stand: '+v.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' km.');$('km').value=''});
$('copy').onclick=copy;$('copy2').onclick=copy;
$('clear').onclick=()=>{if(!lines.length)return;undoState=[...lines];lines=[];save();render();toast('Notatet er tømt',true)};
$('undo').onclick=()=>{if(undoState){lines=undoState;undoState=null;save();render();$('toast').classList.remove('on')}};
$('sep').checked=useSep;$('sep').onchange=e=>{useSep=e.target.checked;save();renderPre()};
paintTheme();renderWhy();render();
}
</script>
</body>
</html>
